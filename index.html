<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxypin Script JSON Generator</title>
<style>
body{font-family:Microsoft YaHei,Arial;background:#f4f6fa;margin:0;padding:20px;color:#222;box-sizing:border-box}
*, *:before, *:after {box-sizing: inherit;}
.box{max-width:1000px;margin:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/3}
label{font-weight:bold;display:block;margin-bottom:5px;font-size:14px}
input,select,textarea,button{width:100%;padding:10px;border-radius:8px;border:1px solid #ccd5e0;font-size:14px}
textarea{height:350px;font-family:Consolas,monospace}
button{background:#2563eb;color:#fff;border:0;cursor:pointer;margin-top:10px;font-size:15px}
h1{margin-top:0;font-size:20px;text-align:center}

/* 手机端自适应适配 */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }
    .box {
        padding: 15px;
        border-radius: 12px;
    }
    .grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }
    .full {
        grid-column: 1;
    }
    textarea {
        height: 280px;
    }
}
</style>
</head>
<body>

<!-- 访问密码验证层 -->
<div id="auth-layer" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f4f6fa;display:flex;justify-content:center;align-items:center;z-index:9999;">
    <div style="background:#fff;padding:30px;border-radius:16px;box-shadow:0 5px 20px #0001;width:320px;text-align:center;">
        <h3 style="margin-top:0;color:#2563eb;">请输入访问密码</h3>
        <input type="password" id="auth-pwd" placeholder="请输入密码" style="margin-bottom:15px;padding:10px;width:100%;border-radius:8px;border:1px solid #ccd5e0;box-sizing:border-box;">
        <button onclick="verifyPassword()" style="background:#2563eb;color:#fff;border:0;padding:10px;border-radius:8px;width:100%;cursor:pointer;">进入系统</button>
    </div>
</div>

<div class="box">
<h1>Proxypin Interpark Script JSON Generator</h1>

<div class="grid">
<div>
<label>ticketNo筛选</label>
<input id="ticket" value="T2935878970">
</div>

<div>
<label>演出日期</label>
<select id="date">
<option value="1113">2026-11-13</option>
<option value="1114">2026-11-14</option>
<option value="1115" selected>2026-11-15</option>
</select>
</div>

<div>
<label>预定日期 (bdate)</label>
<input id="bdate" value="20261008">
</div>

<div>
<label>seatGradeName</label>
<select id="grade">
<option>SOUND CHECK(STANDING)</option>
<option selected>M&G(SEATED)</option>
<option>GENERAL(SEATED)</option>
</select>
</div>

<div>
<label>floor</label>
<select id="floor"></select>
</div>

<div>
<label>rowNo 输入</label>
<input id="row" placeholder="例如 5区 2号 或 S2区">
</div>

<div>
<label>seatNo 输入</label>
<input id="seat" placeholder="例如 13 或 26">
</div>

<div class="full">
<label>seatInfo 自动生成（可修改）</label>
<input id="seatInfo">
</div>

<div class="full">
<button onclick="generate()">生成Proxypin JSON</button>
<button onclick="downloadJSON()" style="background:#16a34a">下载 proxypin-scripts.json</button>
</div>

<div class="full">
<textarea id="output"></textarea>
</div>
</div>
</div>

<script>
// 密码验证逻辑（密码已改为 itp）
function verifyPassword() {
    let pwd = document.getElementById("auth-pwd").value;
    if(pwd === "itp") {
        document.getElementById("auth-layer").style.display = "none";
    } else {
        alert("密码错误，请重新输入！");
    }
}
document.getElementById("auth-pwd").addEventListener("keypress", function(e) {
    if(e.key === "Enter") verifyPassword();
});

const $=x=>document.getElementById(x);

const dateMap={
1113:{playDate:"20261113",time:"1900",cancel:"202611121700",seq:"001",week:"금",list:"2026-11-13T09:30:00Z",end:"2026-11-13T15:00:00Z"},
1114:{playDate:"20261114",time:"1800",cancel:"202611131700",seq:"002",week:"토",list:"2026-11-14T09:30:00Z",end:"2026-11-14T15:00:00Z"},
1115:{playDate:"20261115",time:"1700",cancel:"202611141100",seq:"003",week:"일",list:"2026-11-15T09:30:00Z",end:"2026-11-14T15:00:00Z"}
};

const gradeMap={
"SOUND CHECK(STANDING)":{price:220000,floors:["FLOOR楼"]},
"M&G(SEATED)":{price:253000,floors:["1楼"]},
"GENERAL(SEATED)":{price:165000,floors:["1楼","2楼"]}
};

function syncFloor(){
let old=$("floor").value;
let arr=gradeMap[$("grade").value].floors;
$("floor").innerHTML="";
arr.forEach(v=>{
let o=document.createElement("option");
o.value=v;o.text=v;$("floor").appendChild(o);
});
if(arr.includes(old))$("floor").value=old;
makeSeatInfo();
}

function makeSeatInfo(){
let g=$("grade").value;
let f=$("floor").value;
let r=$("row").value;
let s=$("seat").value;

let floor = f=="1楼" ? "1st Floor" : f=="2楼" ? "2nd Floor" : "FLOOR";

if(g === "SOUND CHECK(STANDING)"){
    let m = r.match(/(S\d+|[A-Za-z0-9]+)/);
    let sidePart = m ? "Side " + m[1] : "";
    let seatNum = s.replace(/\D/g,"");
    let seatPart = seatNum ? "entrance number " + seatNum : "";
    $("seatInfo").value = [g, floor, sidePart, seatPart].filter(Boolean).join(" ");
} else {
    let side="";
    let row="";

    let m=r.match(/(\d+)区/);
    let n=r.match(/(\d+)号/);

    if(m) side="Side "+m[1]+".";
    if(n) row="Row "+n[1]+".";

    let seat=s.replace(/\D/g,"");

    $("seatInfo").value=[g,floor,side,row,seat].filter(Boolean).join(" ");
}
}

function makeScript(name,url,body){
return {
enabled:true,
name:name,
url:url,
script:body
};
}

function getReservationTpl(ticket, d) {
    return `function onRequest(context, request) {
    return request;
}

function onResponse(context, request, response) {
    try {
        const json = JSON.parse(response.body);

        if (!json || !Array.isArray(json.data)) {
            return response;
        }

        json.data.forEach(item => {
            if (
                item &&
                item.repTicketNo === "${ticket}"
            ) {
                // 场次时间
                item.playDateTime =
                    "${d.list}";

                // 演出有效时间区间（固定）
                item.playStartDateTime =
                    "2026-11-12T15:00:00Z";

                item.playEndDateTime =
                    "${d.end}";
                    
                item.goodsCode = "26013161";
                item.goodsName = "TOMORROW X TOGETHER WORLD TOUR 〈STEAL THE WIND〉 IN SEOUL";
                item.placeCode = "26001143";
                item.placeName = "KSPO DOME";
                item.posterImgUrl = "https://ticketimage.interpark.com/Play/image/large/26/26013161_p.gif";
            }
        });

        response.body = JSON.stringify(json);

        response.headers = response.headers || {};
        delete response.headers["content-length"];
        delete response.headers["Content-Length"];

    } catch (e) {
        console.log("修改响应失败: " + e);
    }

    return response;
}`;
}

function getDetailsTpl(ticket, d, bdate, g, f, r, s, p) {
    return `async function onRequest(context, request) {
    return request;
}

async function onResponse(context, request, response) {
    try {
        var url = request.url || "";

        // 只处理 details 接口
        if (url.indexOf("/api/biz/enter/reservations/details") === -1) {
            return response;
        }

        if (typeof response.body !== "string") {
            return response;
        }

        var data = JSON.parse(response.body);

        var TARGET_TICKET_NO = "${ticket}";

        if (!data || !Array.isArray(data.data)) {
            return response;
        }

        data.data.forEach(function(ticket) {
            if (!ticket || ticket.ticketNo !== TARGET_TICKET_NO) {
                return;
            }

            // 演出信息
            ticket.goodsName = "TOMORROW X TOGETHER WORLD TOUR 〈STEAL THE WIND〉 IN SEOUL";

            ticket.placeCode = "26001143";
            ticket.placeName = "KSPO DOME";
            ticket.postImageUrl =
                "https://ticketimage.interpark.com/Play/image/large/26/26013161_p.gif";

            //ticket.delyMethod = "";
            ticket.goodsCode = "26013161";

            ticket.startDate = "20261113";
            ticket.endDate = "20261115";

            ticket.playDate = "${d.playDate}";
            ticket.playTime = "${d.time}";
            ticket.cancelableDate = "${d.cancel}";

            ticket.playSeq = "${d.seq}";
            ticket.bdate = "${bdate}";

            // 座位信息
            ticket.priceGradeName = "General";
            ticket.seatGradeName = "${g}";

            ticket.floor = "${f}";
            ticket.rowNo = "${r}";
            ticket.seatNo = "${s}";

            // 金额
            ticket.salesPrice = "${p}.0";
            ticket.sttlAmount = ${p+8000}.0;
        });

        response.body = JSON.stringify(data);

        if (response.headers) {
            delete response.headers["Content-Length"];
            delete response.headers["content-length"];
        }

    } catch (e) {
        // 出错时保持原响应
    }

    return response;
}`;
}

function getQrTpl(ticket, d, g, info, p) {
    return `async function onRequest(context, request) {
    return request;
}

async function onResponse(context, request, response) {
    try {
        var url = request.url || "";

     
        if (typeof response.body !== "string") {
            return response;
        }

        var data = JSON.parse(response.body);

        var TARGET_TICKET_NO = "${ticket}";

        // 你的数据结构是 result
        if (!data || !Array.isArray(data.result)) {
            return response;
        }


        data.result.forEach(function(ticket) {

            // ticketNo匹配
            if (!ticket || ticket.ticketNo !== TARGET_TICKET_NO) {
                return;
            }


            // ======================
            // 修改演出信息
            // ======================

            ticket.goodsName =
                "TOMORROW X TOGETHER WORLD TOUR 〈STEAL THE WIND〉 IN SEOUL";

            ticket.placeCode = "26001143";
            ticket.placeName = "KSPO DOME";

            ticket.goodsCode = "26013161";
            ticket.qrStatus = "USED_ACTIVE";


            // 图片
            ticket.images = [
                {
                    id: 6000014,
                    url: "https://ticketimage.interpark.com/Play/image/large/26/26013161_p.gif",
                    order: 1
                }
            ];

            // ======================
            // 日期时间
            // ======================
            ticket.playDate = "${d.playDate}";
            ticket.playWeekDay = "${d.week}";
            ticket.playStartTime = "${d.time}";
 
            // 座位

            ticket.priceGradeName = "General";
            ticket.seatGradeName = "${g}";
            ticket.seatInfo =
                "${info}";

            // 金额
            ticket.price = ${p};
        });


        response.body = JSON.stringify(data);

        // 删除长度避免缓存问题
        if (response.headers) {
            delete response.headers["Content-Length"];
            delete response.headers["content-length"];
        }

    } catch (e) {
        console.log(e);
    }
    return response;
}`;
}

function generate(){

let ticket=$("ticket").value;
let d=dateMap[$("date").value];
let bdate=$("bdate").value;
let g=$("grade").value;
let p=gradeMap[g].price;
let f=$("floor").value;
let r=$("row").value;
let s=$("seat").value;

if(g === "SOUND CHECK(STANDING)"){
    if(r && !r.includes("入场号码")){
        r = r.trim() + " 入场号码";
    }
}

let info=$("seatInfo").value;

let reservation = getReservationTpl(ticket, d);
let details = getDetailsTpl(ticket, d, bdate, g, f, r, s, p);
let qr = getQrTpl(ticket, d, g, info, p);

let arr=[
makeScript("change-1","https://world.nol.com/api/biz/enter/reservations",reservation),
makeScript("change-2","https://world.nol.com/api/biz/enter/reservations/details",details),
makeScript("change-3","https://tickets.interpark.com/mt/api/mobile-tickets/detail",qr)
];

$("output").value=JSON.stringify(arr,null,2);
}

$("grade").onchange=syncFloor;
$("floor").onchange=makeSeatInfo;
$("row").oninput=makeSeatInfo;
$("seat").oninput=makeSeatInfo;

syncFloor();

function downloadJSON(){
    let content = $("output").value;
    if(!content){
        alert("请先生成JSON");
        return;
    }

    let blob = new Blob([content], {
        type:"application/json;charset=utf-8"
    });

    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "proxypin-scripts.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

</script>
</body>
</html>
